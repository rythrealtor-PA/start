<script>
'use strict';
const TL = window.TL;
const W = innerWidth || 1080, H = innerHeight || 1920;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;

const GUIDE = new URLSearchParams(location.search).get('guide') === '1';
const ORANGE = '#FF5F00', DARK = '#131110', CREAM = '#FFF6EC', PEACH = '#FFE6CC', AMBER = '#FE9E2C';
const SW = 1180, SH = 2556, K0 = 660 / SW, AX = 540, AY = 1155;
// block 1 is played 22% slower than designed: output t → design d

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

const mapP = (X, x, y) => ({ x: X.ox + x * X.sc, y: X.oy + y * X.sc });

// ---------- assets ----------
const cache = new Map(); let order = [];

}

const frameURL = (clip, src) => `frames/${clip}/${String(availN(clip, Math.round(src * 60))).padStart(5, '0')}.jpg`;

const ICONS = {}; const ICON_LIST = ['book-open', 'briefcase', 'dumbbell', 'shuffle', 'wallet', 'globe', 'heart', 'check', 'users', 'download', 'sparkles', 'arrow-right', 'zap'];

const icon = (name, color) => ICONS[name + '|' + color];
let LOGO, PHOTO;

// ---------- segments ----------

// ---------- drawing helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

let REC = null; // text records for TEXTS(t)

// title: lines [{t, c, s}] centered; animated per line

// pill with optional icon

// ---------- background ----------
const SPARKS = [[110, 470, 34, .5], [985, 330, 26, 2.1], [70, 1350, 22, 1.2], [1010, 1080, 30, 3.0], [990, 1760, 22, .9], [120, 1850, 28, 2.6]];

// ---------- phone ----------

// ---------- annotations ----------

// ---------- cursor ----------
const EVS = [...TL.taps.map(e => ({ ...e, type: 'tap', te: e.t + .16, x2: e.x, y2: e.y })), ...TL.swipes.map(e => ({ ...e, y: e.y0, x2: e.x, y2: e.y1, type: 'swipe', te: e.t + .36 }))].sort((a, b) => a.t - b.t);

// ---------- title zone ----------

// ---------- VO guide overlay ----------
function wrap(c, text, maxW) { const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (c.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; } if (cur) lines.push(cur); return lines; }
function guide(c, t) {
  const V = TL.vo.map(v => ({ ...v, t0: unwarp(v.t0), t1: unwarp(v.t1) }));
  const vo = V.find(v => t >= v.t0 - .25 && t <= v.t1 + .15), next = V.find(v => v.t0 > t);
  c.save(); c.fillStyle = 'rgba(19,17,16,.86)'; rr(c, 24, 1580, W - 48, 316, 28); c.fill();
  const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, '0');
  setFont(c, 26, 700); c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = AMBER;
  c.fillText(`GUÍA VOZ EN OFF · ${m}:${s}${vo ? ' · ' + vo.block : ''}`, 56, 1604);
  if (vo) { const k = clamp((t - vo.t0) / (vo.t1 - vo.t0));
    c.fillStyle = '#3a3532'; rr(c, 56, 1648, W - 112, 8, 4); c.fill(); c.fillStyle = ORANGE; rr(c, 56, 1648, (W - 112) * k, 8, 4); c.fill();
    setFont(c, 40, 700); c.fillStyle = t < vo.t0 ? 'rgba(255,255,255,.55)' : '#fff';
    wrap(c, `${vo.id}. ${vo.text}`, W - 112).slice(0, 4).forEach((l, i) => c.fillText(l, 56, 1676 + i * 50));
  } else {
    setFont(c, 38, 700); c.fillStyle = 'rgba(255,255,255,.45)'; c.fillText('— pausa (solo música) —', 56, 1676);
    if (next) { setFont(c, 30, 600); c.fillStyle = 'rgba(255,255,255,.7)'; wrap(c, `Siguiente en ${(next.t0 - t).toFixed(1)} s: ${next.text}`, W - 112).slice(0, 3).forEach((l, i) => c.fillText(l, 56, 1736 + i * 40)); }
  }
  c.restore();
}
